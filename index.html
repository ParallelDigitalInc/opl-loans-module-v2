/* Layout: OPL app shell (sidebar + centred 1200px column); one prototype bar switches Vaishnav's three approaches. Light only, matching OPL's product UI. */
:root{
  color-scheme:light;
  --indigo:#313379; --indigo-600:#272964; --indigo-50:#EEEEF8; --indigo-100:#DEDFF1; --indigo-300:#9C9ED3;
  --ink:#17172F; --ink-2:#4A4B66; --ink-3:#74758E;
  --line:#E5E5EE; --line-2:#D4D5E2; --bg:#F5F5F8; --surface:#FFFFFF; --wash:#FAFAFC;
  --blue:#3D6DF2; --sand:#F3E8DC; --sand-ink:#6A4A2A; --amber:#D98A1E;
  --good:#17784A; --good-50:#E7F5EE; --warn:#8A5300; --warn-50:#FFF4E0; --warn-line:#F1DDB4; --bad:#B42318; --bad-50:#FDECEA;
  --proto:#15152B; --proto-2:#2A2A48;
  --f:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fd:"Overused Grotesk","Figtree",ui-sans-serif,system-ui,sans-serif;
  --r:16px; --r-md:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-0.01em;text-wrap:balance}
.num{font-family:var(--fd);font-variant-numeric:proportional-nums}
p{margin:0}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--proto);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.proto .brand{font-weight:700;font-size:13px;white-space:nowrap}
.proto .tag{font-size:11px;background:var(--proto-2);border-radius:999px;padding:2px 9px;color:#CFCFF0}
.seg{display:flex;background:var(--proto-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#C9C9E6;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button small{font-weight:500;opacity:.75;margin-left:6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.proto .sp{flex:1}
.pbtn{border:1px solid #44446A;background:none;color:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.pbtn:hover{background:var(--proto-2)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.prof{display:flex;gap:10px;align-items:center;padding:0 6px}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--indigo-50);color:var(--indigo);font-weight:700;font-size:12px}
.prof b{display:block;font-size:13.5px;line-height:1.2}.prof small{font-size:11.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500}
.nav a svg{width:17px;height:17px}
.nav .sub{margin:2px 0 0 18px;padding-left:10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav .sub a{font-size:13.5px;padding:7px 10px}
.nav .sub a.on{background:var(--indigo-50);color:var(--indigo);font-weight:600}
.nav .soon{margin-left:auto;font-size:10px;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink-3)}
.nav .h{color:var(--ink);font-weight:600}
.ca{margin-top:auto;background:var(--sand);color:var(--sand-ink);border-radius:12px;padding:12px;font-size:12.5px}
.ca b{display:block;color:#3F2A14}
.main{min-width:0}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px max(32px,calc((100% - 1200px)/2 + 32px))}
.search{display:flex;align-items:center;gap:8px;max-width:460px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;color:var(--ink-3);font-size:13.5px}
.content{max-width:1200px;margin:0 auto;padding:28px 32px 96px;display:flex;flex-direction:column;gap:20px}
.foot{font-size:12px;color:var(--ink-3)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:18px 20px 14px}
.hd h2{font-size:19px;font-weight:600}
.hd .meta{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.hd .meta svg{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn.pri{background:var(--indigo);color:#fff}.btn.pri:hover{background:var(--indigo-600)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}.btn.sec:hover{border-color:var(--ink-3)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.on{background:var(--indigo-50);border-color:var(--indigo);color:var(--indigo)}
.lnk{border:0;background:none;padding:0;color:var(--indigo);font-weight:600;font-size:13px;cursor:pointer}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.lg{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em}
.lg.s{width:28px;height:28px;font-size:9.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--bg);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.chip b{font-family:var(--fd);font-weight:600;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--indigo);color:#fff}.chip[aria-pressed="true"] b{color:#C9CBEE}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tg svg{width:11px;height:11px}
.tg.free{background:var(--good-50);color:var(--good)}
.tg.coll{background:var(--sand);color:var(--sand-ink)}
.tg.fact{background:var(--indigo-50);color:var(--indigo)}
.tg.st{background:var(--bg);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cap{font-size:12.5px;color:var(--ink-3)}
select.sel{font:inherit;font-size:13px;border:1px solid var(--line-2);border-radius:9px;padding:7px 30px 7px 11px;background:var(--surface);color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}

/* greeting + needs banner */
.greet h1{font-size:30px;font-weight:600}
.greet p{color:var(--ink-3);font-size:13px;margin-top:2px}
.pt{font-size:30px;font-weight:600}
.need{display:flex;align-items:center;gap:14px;background:var(--warn-50);border:1px solid var(--warn-line);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
.need .ic{flex:none;width:28px;height:28px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-weight:700}
.need .tx{flex:1;min-width:220px}
.need .tx b{display:block;font-weight:600}
.need .tx span{font-size:13px;color:var(--ink-2)}
.need .acts{display:flex;align-items:center;gap:14px}

/* eligibility */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0 20px 18px}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);min-width:0}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--line-2);box-shadow:0 6px 16px rgba(23,23,47,.06)}
.tile .ti{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tile .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.tile .ic svg{width:13px;height:13px}
.tile .lb{font-size:13px;color:var(--ink-2)}
.tile .v{font-family:var(--fd);font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.15}
.tile .sub{font-size:12px;color:var(--ink-3)}
.stack{display:flex}
.stack i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;display:grid;place-items:center;font-style:normal;font-size:8px;font-weight:700;color:#fff}
.stack i:first-child{margin-left:0}
.stack i.more{background:var(--bg);color:var(--ink-2);width:auto;padding:0 6px;border-radius:999px;font-size:10px}
.tile.cmr{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:end}
.tile.cmr .ti{grid-column:1/-1}
.tile.cmr .gw{grid-row:2/span 3;grid-column:2;width:104px}
.up{font-size:11.5px;font-weight:600;color:var(--good);background:var(--good-50);border-radius:999px;padding:2px 8px}
.mstrip{display:flex;align-items:center;gap:12px;background:#EEF0FB;border-top:1px solid var(--line);padding:0 16px 0 20px;min-height:52px;border-radius:0 0 var(--r) var(--r)}
.mstrip:not(:last-child){border-radius:0}
.mstrip img{width:52px;height:38px;object-fit:contain;object-position:bottom;align-self:flex-end}
.mstrip .q{flex:1;font-weight:600;color:var(--indigo);font-size:14.5px}
.ask{border:1.5px solid var(--indigo);background:var(--surface);color:var(--indigo);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.ask:hover{background:var(--indigo);color:#fff}
.sumbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding:14px 20px}
.sumbar .tx{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.sumbar .tx b{font-weight:600}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;color:var(--ink-2);background:var(--surface);cursor:pointer}
.mini b{font-family:var(--fd);color:var(--ink);font-weight:600}

/* offer table rows */
.ofh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 20px 14px}
.ofh .sp{flex:1}
.rows{padding:0 20px 8px}
.rowh,.orow{display:grid;grid-template-columns:minmax(200px,1.6fr) 90px 80px 110px 120px 100px 186px;align-items:center;gap:14px}
.rowh{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;padding:0 14px 8px}
.rowh span:not(:first-child){text-align:right}
.rowh span:last-child{text-align:left}
.orow{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface)}
.orow.inc{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.ol{display:flex;gap:12px;align-items:center;min-width:0}
.ol b{display:block;font-weight:600;font-size:15px}
.ol small{display:block;font-size:12.5px;color:var(--ink-3)}
.ol .tgs{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.oc{text-align:right;display:flex;flex-direction:column;line-height:1.25}
.oc b{font-family:var(--fd);font-size:16px;font-weight:600;font-variant-numeric:proportional-nums}
.oc small{font-size:11.5px;color:var(--ink-3)}
.oa{display:flex;gap:8px;justify-content:flex-end}
.k{display:none;font-size:11px;color:var(--ink-3)}
.more{display:flex;justify-content:center;padding:4px 0 16px}
.unm{margin:0 20px 18px;border:1px dashed var(--line-2);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--ink-2)}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px rgba(23,23,47,.25);max-width:calc(100vw - 32px)}
.cmpbar .stack i{border-color:var(--ink)}
.cmpbar .btn.sec{background:transparent;color:#fff;border-color:#55557A}

/* things need you */
.tlist{padding:0 20px 8px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .when{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.trow b{font-weight:600;font-size:14.5px}
.trow span.s{font-size:13px;color:var(--ink-2)}
.trow .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.trow.done .tx{opacity:.5}.trow.done b{text-decoration:line-through}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chk i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.chk[aria-pressed="true"]{border-color:var(--good);color:var(--good);background:var(--good-50)}
.chk[aria-pressed="true"] i{background:var(--good);border-color:var(--good)}

/* loans today */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0 20px 16px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi b{display:block;font-family:var(--fd);font-size:26px;font-weight:600;letter-spacing:-0.02em;line-height:1.2}
.kpi small{font-size:12px;color:var(--ink-3)}
.kpis.flat{gap:0}.kpis.flat .kpi{border:0;padding:0 0 4px}
.split{display:flex;gap:2px;height:10px;margin:0 20px;border-radius:99px;overflow:hidden}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 20px 18px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.afford{margin:0 20px 18px;display:flex;align-items:center;gap:12px;background:#EEF0FB;border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.afford .tx{flex:1;min-width:200px;font-size:13px}

/* gauge card */
.gcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 20px 18px;text-align:center}
.gcard .g{width:220px;max-width:100%}
.gcard .cap{max-width:320px}
.pill-ai{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1.5px solid var(--indigo-100);background:var(--indigo-50);border-radius:12px;padding:10px 14px;cursor:pointer;margin-top:6px;text-align:left}
.pill-ai b{color:var(--indigo)}
.pill-ai span{font-size:12.5px;color:var(--ink-2)}

/* EMI calculator */
.calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:0 20px 20px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld .fh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fld .fh b{font-weight:600;font-size:14.5px}
.fld .fh small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px}
.inbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:10px;padding:6px 10px;background:var(--wash);font-family:var(--fd);font-weight:600;font-size:16px}
.inbox span{color:var(--ink-3);font-size:13px;font-weight:500}
.inbox input{border:0;background:none;font:inherit;width:110px;text-align:right;color:var(--ink);outline:0}
.inbox.s input{width:46px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(var(--indigo),var(--indigo)) 0/var(--p,50%) 100% no-repeat,var(--line);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--indigo);box-shadow:0 1px 4px rgba(23,23,47,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--indigo)}
.marks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.res{background:var(--indigo-50);border:1px solid var(--indigo-100);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.res .r1{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res .r1 span{font-size:13px;color:var(--ink-2)}
.res .big{display:block;font-family:var(--fd);font-size:38px;font-weight:600;letter-spacing:-0.02em;line-height:1.05}
.res .tp{text-align:right}.res .tp b{display:block;font-family:var(--fd);font-size:20px;font-weight:600}
.pbar{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%}
.pleg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.pleg span{display:inline-flex;align-items:center;gap:6px}.pleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.meter{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.meter .bar{position:relative;height:8px;border-radius:99px;background:var(--line);overflow:visible}
.meter .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.meter .bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.meter .mt{font-size:12.5px;color:var(--ink-2)}
.meter .mt b{color:var(--ink)}
.calc .note{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}

/* compare */
.crumb{font-size:13px}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.chead h1{font-size:30px;font-weight:600}
.chead p{color:var(--ink-2);margin-top:4px}
.slots{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.slots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block}
.slots i.f{background:var(--indigo)}
.ctools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctools .sp{flex:1}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-size:13.5px;color:var(--ink-2);padding:0}
.tog i{width:32px;height:18px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed="true"] i{background:var(--indigo)}.tog[aria-pressed="true"] i::after{left:16px}
.amts{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.msum{display:flex;gap:12px;align-items:flex-start;background:#EEF0FB;border-radius:14px;padding:12px 16px}
.msum img{width:44px;height:32px;object-fit:contain}
.msum p{flex:1;font-size:13.5px}
.msum small{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ct{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.ct th,.ct td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ct tr:last-child td{border-bottom:0}
.ct .rl{font-weight:500;font-size:13.5px}
.ct .rl small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.ct td.c{border-left:1px solid var(--line);font-size:14.5px}
.ct td.c .num{font-weight:600}
.ct .grp td{background:var(--wash);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 16px;font-weight:600}
.ct .lowest{margin-left:6px;font-size:11px;font-weight:600;color:var(--good);background:var(--good-50);border-radius:999px;padding:1px 7px}
.ct thead th{border-bottom:1px solid var(--line);vertical-align:top}
.ch{border-radius:12px;padding:12px 32px 12px 12px;display:flex;gap:10px;align-items:flex-start;position:relative}
.ch>div{min-width:0}
.ch b{display:block;font-weight:600;font-size:15px}.ch small{display:block;font-size:12px;color:var(--ink-2)}
.ch .x{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1px solid rgba(23,23,47,.12);background:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;font-size:12px;color:var(--ink-2)}
.addslot{border:1.5px dashed var(--line-2);border-radius:12px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:none;width:100%;color:var(--indigo);font-weight:600;padding:10px}
.addslot small{color:var(--ink-3);font-weight:400;font-size:12px}
.ct tr.same td.c{color:var(--ink-3)}
.cacts{display:flex;flex-direction:column;gap:6px}

/* drawers, mitra, toast */
.scrim{position:fixed;inset:0;background:rgba(21,21,43,.35);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(23,23,47,.18)}
.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 20px 12px}
.drawer header h2{font-size:20px}
.drawer header p{font-size:13px;color:var(--ink-3)}
.drawer .x2{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2);padding:4px}
.drawer .body{flex:1;overflow:auto;padding:0 20px 20px}
.drawer footer{border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px}
.drawer footer .sp{flex:1}
.pick{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.pick .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);display:grid;place-items:center;color:#fff;font-size:12px}
.pick[aria-pressed="true"] .bx{background:var(--indigo);border-color:var(--indigo)}
.pick b{font-weight:600}.pick small{display:block;font-size:12px;color:var(--ink-3)}
.pick .ap{text-align:right;font-family:var(--fd);font-weight:600}.pick .ap small{font-family:var(--f);font-weight:400}
.pick[disabled]{opacity:.45;cursor:not-allowed}
.notes h3{font-size:15px;margin:18px 0 8px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.notes .who{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.mdock{position:fixed;right:20px;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 6px 8px;box-shadow:0 10px 30px rgba(23,23,47,.14);cursor:pointer;text-align:left}
.mdock img,.mpanel header img{width:44px;height:32px;object-fit:contain;object-position:bottom}
.mdock b,.mpanel header b{display:flex;align-items:center;gap:6px;font-size:14px}
.mdock small,.mpanel header small{display:block;font-size:12px;color:var(--ink-3)}
.aib{font-style:normal;font-size:9.5px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 3px;line-height:13px;color:var(--ink-2)}
.mpanel{position:fixed;right:20px;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:55;width:min(380px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(23,23,47,.2);overflow:hidden}

@media (prefers-reduced-motion:reduce){.content.anim>*{animation:none}*{transition:none!important}}

/* responsive */

/* ---------- CMR gauge: 10 solid steps, every step at least 3:1 on white ---------- */
const GSTEPS=["#1E7A4C","#2F7F3E","#4F7F2A","#6E7A1C","#86701A","#97661B","#A4581E","#AE4A21","#B13C24","#B02E27"];
function gauge(v,small){
  const W=200,H=small?104:114,cx=100,cy=100,r=80,seg=10,gap=1.6*Math.PI/180;let arcs="";
  for(let i=0;i<seg;i++){const a0=Math.PI-(i/seg)*Math.PI-gap/2,a1=Math.PI-((i+1)/seg)*Math.PI+gap/2;const p=a=>[cx+r*Math.cos(a),cy-r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const on=i+1===v;
    arcs+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${GSTEPS[i]}" stroke-width="${on?16:11}" fill="none" stroke-linecap="butt"/>`;}
  const am=Math.PI-((v-.5)/seg)*Math.PI;const mx=cx+r*Math.cos(am),my=cy-r*Math.sin(am);
  return `<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="CMR ${v} of 10, medium risk">${arcs}<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="8" fill="#fff" stroke="#17172F" stroke-width="3"/><text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="Overused Grotesk, Figtree, sans-serif" font-size="34" font-weight="600" fill="#17172F">${v}</text>${small?'':`<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="11.5" fill="#4A4B66">of 10</text><text x="20" y="${H-1}" text-anchor="middle" font-size="11" fill="#4A4B66">1</text><text x="${W-20}" y="${H-1}" text-anchor="middle" font-size="11" fill="#4A4B66">10</text>`}</svg>`;
}

 bobwhen:"When will Bank of Baroda decide?",stock:"What is a stock statement?",axis:"Why didn't Axis Bank approve my loan?",ccfirst:"Which loan should I pay down first?",refi:"Can I refinance a loan for less?",miss:"What happens if I miss an EMI?"};
const ROT={elig:["why","collat","cmr3","afford"],apps:["bobwhen","stock","axis"],mine:["ccfirst","refi","miss"]};
function rotStrip(key,solo){
  const list=ROT[key], i=S.rotI[key]%list.length, k=list[i];
  return `<div class="mstrip rot${solo?' solo':''}" data-rot="${key}"><img src="${MITRA}" alt="">
    <span class="mqw" aria-live="polite"><span class="mq">${esc(MQ[k])}</span></span>
    <span class="mdots" role="group" aria-label="Questions">${list.map((x,n)=>`<button data-rotgo="${key}:${n}" aria-label="${esc(MQ[x])}" aria-current="${n===i}"></button>`).join("")}</span>
    <button class="ask" data-ask="${k}">Ask Mitra</button></div>`;
}
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function rotTo(el,key,n,anim){
  S.rotI[key]=n; const k=ROT[key][n]; const t=el.querySelector(".mq"), b=el.querySelector(".ask"), img=el.querySelector("img");
  const swap=()=>{t.textContent=MQ[k];b.dataset.ask=k;el.querySelectorAll(".mdots button").forEach((d,x)=>d.setAttribute("aria-current",x===n));};
  if(!anim||RM){swap();return;}
  t.classList.add("out");
  setTimeout(()=>{swap();t.classList.remove("out");t.classList.add("in");void t.offsetWidth;t.classList.remove("in");},220);
  if(img.animate) img.animate([{transform:"translateY(0) rotate(0)"},{transform:"translateY(-3px) rotate(-6deg)"},{transform:"translateY(0) rotate(0)"}],{duration:520,easing:"ease-out"});
}
setInterval(()=>{
  if(document.hidden||RM) return;
  document.querySelectorAll(".mstrip[data-rot]").forEach(el=>{
    const key=el.dataset.rot,len=ROT[key].length;
    if(el.matches(":hover")||el.contains(document.activeElement)||S.rotN[key]>=len*3) return;
    S.rotN[key]++; rotTo(el,key,(S.rotI[key]+1)%len,true);

},4200);

function viewCompare(){

  const amts=[...new Set([mx,2500000,1000000])].filter(v=>v<=mx).sort((a,b)=>b-a);

  const say=`<b>Mitra:</b> On ${L(P)}, ${lowA.name} has the lowest APR (${pct(apr(lowA))})${lowA.coll?` but needs ${lowA.coll.toLowerCase()}`:''}. ${free.length&&minBy(free,apr)!==lowA?`${minBy(free,apr).name} needs no collateral at ${pct(apr(minBy(free,apr)))}. `:''}${fast.name} is quickest, about ${fast.days} working days.`;
  const slots=5-os.length, cols=os.length+1+(slots?1:0);

  const idxMin=a=>a.indexOf(Math.min(...a)), idxMax=a=>a.indexOf(Math.max(...a));

  <div class="msum"><img src="${MITRA}" alt=""><p>${say}</p><small>Numbers from OPL · you decide</small></div>
  <div class="tw"><table class="ct" style="min-width:${170+os.length*180+(slots?150:0)}px"><colgroup><col style="width:170px">${os.map(()=>"<col>").join("")}${slots?'<col style="width:150px">':""}</colgroup><thead><tr><th class="rl" style="font-weight:600">Side by side<small>On ${L(P)} · Ratan Fabrics</small></th>
    ${os.map(o=>`<th><div class="ch" style="background:${o.tint}">${lg(o)}<div><b>${esc(o.name)}</b><small>${prod(o)}</small><button class="lnk" style="margin-top:6px;font-size:12px" data-ask="offer:${o.id}">${ICON.spark} Explain</button></div><button class="x" data-uncmp="${o.id}" aria-label="Remove ${esc(o.name)}">✕</button></div></th>`).join("")}
    ${slots?`<th><button class="addslot" data-drawer="add">+ Add a loan<small>${slots} more slot${slots>1?'s':''}</small></button></th>`:''}</tr></thead><tbody>
    <tr class="grp"><td colspan="${cols}">Cost on ${L(P)}</td></tr>
    ${row("APR","All-in yearly cost",os.map(apr),idxMin(os.map(apr)),v=>n(pct(v)))}
    ${row("EMI","Each month after any moratorium",os.map(o=>monthly(o,P)),idxMin(os.map(o=>monthly(o,P))),(v,i)=>n(R(v))+`<span class="cap"> · ${os[i].ten-os[i].mor} EMIs</span>`)}
    ${row("Total cost","Interest + fee over the tenure",os.map(o=>total(o,P)),idxMin(os.map(o=>total(o,P))),v=>n(R(v)))}
    ${row("Processing fee","One time, incl. GST",os.map(o=>fee(o,P)),idxMin(os.map(o=>fee(o,P))),v=>n(R(v)))}

    <tr class="grp"><td colspan="${cols}">Terms</td></tr>
    ${row("Loan up to","Most this lender gives",os.map(o=>o.max),idxMax(os.map(o=>o.max)),v=>n(L(v)),"Highest")}
    ${row("Collateral","What you pledge",os.map(o=>o.coll),null,v=>v?`<span class="tg coll">${ICON.house}${esc(v)}</span>`:`<span class="tg free">${ICON.shield}No collateral</span>`)}
    ${row("Tenure","Including interest-only months",os.map(o=>o.ten+" months"+(o.mor?` · ${o.mor} interest-only`:'')),null)}
    ${row("Time to money","After KYC",os.map(o=>o.days),idxMin(os.map(o=>o.days)),v=>n(v+" working days"),"Fastest")}
    ${row("Prepayment",null,os.map(o=>o.prepay),null)}
    ${row("Lender type",null,os.map(o=>o.type),null)}
    <tr><td class="rl"></td>${os.map(o=>`<td class="c"><div class="cacts"><button class="btn pri sm" data-select="${o.id}">Select</button><button class="btn sec sm" data-toast="Opens ${esc(o.name)}'s details and Key Fact Statement">Details &amp; KFS</button></div></td>`).join("")}${slotCell()}</tr>
  </tbody></table></div>`;
}

  const v=$("#view"), key=S.view+S.tab+S.appr;
  if(key!==lastKey){v.classList.remove("anim");void v.offsetWidth;v.classList.add("anim");lastKey=key;}
  const body=S.view==="compare"?viewCompare():S.tab==="offers"?tabOffers():S.tab==="apps"?tabApps():S.tab==="mine"?tabMine():({A:overA,C:overC,E:overE,F:overF}[S.appr])();
  v.innerHTML=header()+body+`<p class="foot">OPL is a loan marketplace, not a lender. You see the Key Fact Statement before you accept. Grievance officer: grievance@opl.example · Sample data.</p>`;
  const cmpbar=(S.view!=="compare"&&S.cmp.length)?`<div class="cmpbar">${stack(S.cmp.map(byId),5)}<span><b>${S.cmp.length}</b> in compare</span><button class="btn sec sm" data-clearcmp>Clear</button><button class="btn pri sm" data-compare>Compare</button></div>`:'';
  const toast=S.toast?`<div class="toast" role="status"><span class="ok">✓</span><span>${S.toast.msg}</span>${S.toast.undo?'<button data-undo>Undo</button>':''}</div>`:'';
  $("#layer").innerHTML=(S.drawer==="add"?addDrawer():'')+(S.notes?notesDrawer():'')+cmpbar+mitra()+toast;
  const mb=$("#mb"); if(mb) mb.scrollTop=mb.scrollHeight;

function toast(msg,undo){S.toast={msg,undo};clearTimeout(tt);render();tt=setTimeout(()=>{S.toast=null;render();},undo?5000:2600);}
function setTab(t){S.tab=t;S.view="main";window.scrollTo({top:0});render();}

  if(d.tip){const r=t.getBoundingClientRect();const p=document.createElement("div");p.className="pop";p.textContent=TIPS[d.tip];document.body.appendChild(p);p.style.left=Math.max(12,Math.min(window.scrollX+r.left-130,window.scrollX+document.documentElement.clientWidth-p.offsetWidth-12))+"px";p.style.top=(window.scrollY+r.bottom+8)+"px";return;}
  if(d.lamt){S.amt=+d.lamt;S.lamtOpen=false;render();return;}
  if(d.lten){S.ten=+d.lten;render();return;}
  if(d.lamtother!==undefined){S.lamtOpen=true;render();const el=$("#amtIn2");if(el){el.focus();el.select();}return;}
  if(d.appr){S.appr=d.appr;S.tab="over";S.view="main";save();window.scrollTo({top:0});render();return;}
  if(d.ocard){S.ocard=d.ocard;S.showAll=false;save();render();return;}
  if(d.urgent!==undefined){S.urgent=!S.urgent;save();render();return;}
  if(d.confirm){const f=FACS.find(x=>x.id===d.confirm);S.lend[f.id]=f.hint;render();toast(`Saved. This is your ${f.hint.lender} ${f.type.toLowerCase()}.`);return;}
  if(d.dismiss){S.dismiss[d.dismiss]=true;render();return;}
  if(d.name){S.naming=d.name;render();const el=$("#nm-"+d.name);if(el)el.focus();return;}
  if(d.namecancel!==undefined){S.naming="";render();return;}
  if(d.tcard){S.tcard=d.tcard;save();render();return;}
  if(d.notes!==undefined){S.notes=true;render();return;}
  if(d.close!==undefined){S.notes=false;S.drawer="";S.pick=[];render();return;}
  if(d.tab){setTab(d.tab);return;}
  if(d.compare!==undefined){S.view="compare";S.tab="offers";window.scrollTo({top:0});render();return;}
  if(d.offers){S.chip=d.offers;setTab("offers");return;}
  if(d.chip){S.chip=d.chip;render();return;}
  if(d.showall!==undefined){S.showAll=!S.showAll;render();return;}
  if(d.cmp){const id=d.cmp;if(S.cmp.includes(id))S.cmp=S.cmp.filter(x=>x!==id);else if(S.cmp.length<5)S.cmp.push(id);else{toast("You can compare up to 5 offers");return;}S.cmpAmt=0;render();return;}
  if(d.uncmp){S.cmp=S.cmp.filter(x=>x!==d.uncmp);S.cmpAmt=0;render();return;}
  if(d.clearcmp!==undefined){S.cmp=[];render();return;}
  if(d.select){const o=byId(d.select);if(!S.sent.includes(o.id)){if(S.sent.length>=3){toast("You've used 3 of 3 selections for October");return;}S.sent.push(o.id);}toast(`${o.name} selected. It's in Applications while the lender reviews. No credit enquiry until you accept.`);return;}
  if(d.drawer){S.drawer=d.drawer;S.pick=[];S.pq="";render();return;}
  if(d.pick){S.pick=S.pick.includes(d.pick)?S.pick.filter(x=>x!==d.pick):[...S.pick,d.pick];render();return;}
  if(d.pchip){S.pchip=d.pchip;render();return;}
  if(d.addpicked!==undefined){S.cmp=[...S.cmp,...S.pick].slice(0,5);S.drawer="";S.pick=[];S.cmpAmt=0;render();return;}
  if(d.diff!==undefined){S.diff=!S.diff;render();return;}
  if(d.camt){S.cmpAmt=+d.camt;render();return;}
  if(d.sendca!==undefined){toast("Comparison sent to Hitesh on WhatsApp. We'll tell you when he replies.",true);return;}
  if(d.undo!==undefined){S.toast=null;toast("Not sent");return;}
  if(d.done){S.done[d.done]=!S.done[d.done];render();return;}
  if(d.tbl!==undefined){S.tbl=!S.tbl;render();return;}
  if(d.rotgo){const [k,n]=d.rotgo.split(":");S.rotN[k]=99;rotTo(t.closest(".mstrip"),k,+n,true);return;}
  if(d.copy){const v=d.copy;const ok=()=>toast("Number copied");(navigator.clipboard?navigator.clipboard.writeText(v).then(ok,()=>toast(v)):toast(v));return;}
  if(d.toast){toast(d.toast);return;}
  if(d.mopen!==undefined){S.mp=true;render();return;}
  if(d.mclose!==undefined){S.mp=false;render();return;}
  if(d.ask){const k=d.ask;const q=k.startsWith("offer:")?`Explain the ${byId(k.slice(6)).name} offer`:MQ[k];S.mp=true;S.thread.push({k,q});render();return;}
});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-nameform]");if(!f)return;e.preventDefault();const id=f.dataset.nameform,v=f.querySelector("input").value.trim();if(!v)return;const w=v.split(/\s+/);S.lend[id]={src:"user",lender:v,short:(w[0][0]+(w[1]?w[1][0]:w[0][1]||"")).toUpperCase(),hue:"#4A4B66"};S.naming="";render();});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;render();}if(e.target.id==="fsort"){S.fsort=e.target.value;render();}});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
document.addEventListener("input",e=>{const id=e.target.id,v=e.target.value;
  if(id==="pq"){S.pq=v;const pos=e.target.selectionStart;render();const el=$("#pq");el.focus();el.setSelectionRange(pos,pos);return;}
  if(id==="amt"||id==="rate"||id==="ten"){S[id]=+v;render();const el=$("#"+id);if(el)el.focus();}});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value.replace(/[^\d.]/g,""),minR=Math.min(...OFF.map(o=>o.rate)),maxR=Math.max(...OFF.map(o=>o.rate));
  if(id==="amtIn2"){S.amt=clamp(Math.round((+v||0)/1e5)*1e5,1e5,MAXC);render();}
  if(id==="amtIn"){S.amt=clamp(Math.round((+v||0)/1e5)*1e5,1e5,MAXC);render();}
  if(id==="rateIn"){S.rate=clamp(+v||minR,minR,maxR);render();}
  if(id==="tenIn"){S.ten=clamp(Math.round(+v||1),1,5);render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.drawer||S.notes){S.drawer="";S.notes=false;render();}else if(S.mp){S.mp=false;render();}}});
render();
</script>
